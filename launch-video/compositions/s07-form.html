<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

  <body>
    <template>
      <style>
        #s07 {

        }
        #s07-head {

          text-align: center;
          font-size: 76px;
          white-space: nowrap;
        }
        #s07-head .serif-i {
          color: var(--accent-soft);
        }
        #s07-cam {
          position: absolute;
          inset: 0;
        }
        #s07-term {
          left: 250px;
          top: 208px;
          width: 1420px;
          height: 830px;
        }
        #s07 .term-body {
          font-size: 25px;
          padding: 30px 40px;
        }
        #s07-form {
          position: relative;
          margin-top: 6px;
          border: 2px solid var(--accent);
          border-radius: 10px;
          background: #161616;
          padding: 26px 32px 22px;
          transform-origin: 50% 0%;
        }
        #s07-form .f-title {
          font-family: var(--sans);
          font-size: 34px;
          font-weight: 700;
          letter-spacing: -0.01em;

          white-space: nowrap;

        }

          color: var(--accent-soft);
          text-decoration: underline;
          text-decoration-color: rgba(147, 160, 255, 0.5);
          text-underline-offset: 5px;
        }
        #s07-form .f-note {
          font-size: 21px;
          color: var(--muted);
          margin: 10px 0 18px;
          line-height: 1.45;
        }
        #s07-form .field {
          display: flex;
          align-items: center;
          gap: 20px;
          margin-top: 12px;
          white-space: nowrap;
        }
        #s07-form .flabel {
          width: 240px;
          flex: none;
          color: var(--text);
        }
        #s07-form .finput {
          flex: 1;
          height: 56px;
          border-radius: 6px;
          border: 1px solid var(--line-2);
          background: #0b0b0b;
          display: flex;
          align-items: center;
          padding: 0 18px;
          font-size: 24px;
          color: var(--text);
          overflow: hidden;
        }
        #s07-form .ftag {
          flex: none;
          font-size: 19px;
          padding: 6px 12px;
          border-radius: 8px;
          color: var(--accent-soft);
          border: 1px solid rgba(147, 160, 255, 0.5);
          background: rgba(43, 68, 255, 0.18);
        }
        #s07-form .fcur {
          display: inline-block;
          width: 11px;
          height: 28px;
          background: var(--accent-soft);
          margin-left: 2px;
          opacity: 0;
        }
        #s07-form .hint {
          margin-top: 18px;
          font-size: 19px;
          color: var(--dim);
          display: flex;
          align-items: center;
          gap: 10px;
        }
        #s07-enter {
          display: inline-block;
          font-family: var(--sans);
          font-size: 18px;
          font-weight: 600;
          padding: 3px 10px;
          border-radius: 7px;
          border: 1px solid var(--line-2);
          color: var(--text);
          background: rgba(255, 255, 255, 0.05);
        }
        #s07-result {
          position: absolute;
          left: 40px;
          right: 40px;
          top: 206px;
        }
      </style>

      <div id="s07" class="light" data-composition-id="s07-form" data-width="1920" data-height="1080" data-duration="6.8">
        <div class="bg-fill"></div>

        <div class="display" id="s07-head">A form. <span class="serif-i">Right in your session.</span></div>

        <div id="s07-cam">
          <div class="term" id="s07-term">
            <div class="term-bar">
              <div class="term-dot"></div>
              <div class="term-dot"></div>
              <div class="term-dot"></div>
              <div class="term-title">claude — ~/shop-app</div>
            </div>
            <div class="term-body" style="position: relative">
              <div class="t-prompt"><span class="t-caret">&gt;</span><span>add Stripe checkout to my app</span></div>
              <div class="t-line" id="s07-call"><span class="t-bullet accent"></span><span><span class="k-tool">human-input - request_input</span> <span class="k-dim">(MCP)(title: "Stripe test keys", save_to: ".env.local")</span></span></div>

              <div id="s07-form">
                <div class="f-title">Stripe test keys</div>
                <div class="f-row" id="s07-r1">Open: <span class="f-link">https://dashboard.stripe.com/test/apikeys</span></div>
                <div class="f-row" id="s07-r2">1. Copy the Publishable key (starts pk_test_).</div>
                <div class="f-row" id="s07-r3">2. Click “Reveal test key” on the Secret key row and copy it.</div>
                <div class="f-note" id="s07-r4">(Opened in your browser.) Saved privately and written to .env.local. Secret values are not sent to Claude.</div>
                <div class="field" id="s07-f1">
                  <span class="flabel">Publishable key</span>
                  <span class="finput" id="s07-in1"><span id="s07-v1">pk_test_51NxT8qK2eZvKb3r9fQ7mA0pLw</span><span class="fcur" id="s07-c1"></span></span>
                </div>
                <div class="field" id="s07-f2">
                  <span class="flabel">Secret key</span>
                  <span class="finput" id="s07-in2"><span id="s07-v2">sk_test_<span></span>51NxT8qK2eZvKb3r9fQ7mA0</span><span class="fcur" id="s07-c2"></span></span>
                  <span class="ftag">secret: never shown to Claude</span>
                </div>
                <div class="hint"><span id="s07-enter">Enter ↵</span> to submit</div>
              </div>

              <div id="s07-result">
                <div class="t-sub" id="s07-res1" style="margin: 0 0 18px 32px"><span class="t-elbow"></span><span>Saved <span style="color: var(--ok)">STRIPE_PUBLISHABLE_KEY</span>, <span style="color: var(--ok)">STRIPE_SECRET_KEY</span> → .env.local</span></div>
                <div class="t-line" id="s07-res2"><span class="t-bullet"></span><span>Keys are in place. Checkout is ready to test.</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s07-head", { opacity: 0, y: 24, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.05);
          tl.fromTo("#s07-cam", { opacity: 0, scale: 0.9, y: 80 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0);
          tl.fromTo("#s07-call", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.38);
          tl.fromTo("#s07-form", { opacity: 0, y: 40, scaleY: 0.92 }, { opacity: 1, y: 0, scaleY: 1, duration: 0.5, ease: "expo.out" }, 0.75);
          ["#s07-r1", "#s07-r2", "#s07-r3", "#s07-r4", "#s07-f1", "#s07-f2"].forEach((id, i) => {
            tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.9 + i * 0.08);
          });
          // field 1
          tl.set("#s07-in1", { borderColor: "rgba(147,160,255,0.95)" }, 1.55);
          tl.set("#s07-c1", { opacity: 1 }, 1.55);
          HF.typeOn(tl, document.getElementById("s07-v1"), 1.65, 44);
          tl.set("#s07-in1", { borderColor: "rgba(255,255,255,0.14)" }, 2.55);
          tl.set("#s07-c1", { opacity: 0 }, 2.55);
          // field 2
          tl.set("#s07-in2", { borderColor: "rgba(147,160,255,0.95)" }, 2.6);
          tl.set("#s07-c2", { opacity: 1 }, 2.6);
          HF.typeOn(tl, document.getElementById("s07-v2"), 2.7, 44);
          // submit
          tl.fromTo("#s07-enter", { scale: 1, backgroundColor: "rgba(255,255,255,0.05)" }, { scale: 0.88, backgroundColor: "rgba(43,68,255,0.9)", duration: 0.08, yoyo: true, repeat: 1 }, 3.72);
          tl.to("#s07-form", { opacity: 0, scaleY: 0.2, y: -40, filter: "blur(6px)", duration: 0.32, ease: "power3.in" }, 3.9);
          tl.fromTo("#s07-res1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 4.15);
          tl.fromTo("#s07-res2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 4.5);
          // slow push, then exit left
          tl.to("#s07-cam", { scale: 1.28, x: 70, y: 150, duration: 1.1, ease: "expo.inOut" }, 4.2);
          tl.to("#s07-cam", { scale: 1.32, x: 74, y: 156, duration: 1.0, ease: "none" }, 5.31);
          tl.to(["#s07-cam", "#s07-head"], { x: -1200, opacity: 0, filter: "blur(14px)", duration: 0.45, ease: "power3.in" }, 6.35);
          window.__timelines["s07-form"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
