<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s03 {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s03-reply {
          position: absolute;
          left: 260px;
          top: 360px;
          width: 1400px;
          font-family: var(--mono);
          font-size: 40px;
          line-height: 1.5;
          color: var(--text);
        }
        #s03-reply .row {
          display: flex;
          gap: 26px;
          align-items: flex-start;
        }
        #s03-reply .t-bullet {
          width: 20px;
          height: 20px;
          margin-top: 20px;
        }
        #s03-reply .sub {
          color: var(--muted);
          margin-left: 46px;
        }
        #s03-big {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0;
        }
        #s03-l1 {
          font-size: 230px;
        }
        #s03-l2 {
          font-size: 250px;
          color: var(--danger);
          line-height: 0.9;
        }
        #s03-shake {
          position: absolute;
          inset: 0;
        }
        #s03-count {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 90px;
          text-align: center;
        }
      </style>

      <div id="s03" data-composition-id="s03-rotate" data-width="1920" data-height="1080" data-duration="3.4">
        <div class="bg-fill" style="background: var(--ink-cold)"></div>
        
        <div id="s03-reply">
          <div class="row"><span class="t-bullet warn"></span><span id="s03-type">You've shared a live secret key in this chat.</span></div>
          <div class="sub" id="s03-sub">You should rotate it now.</div>
        </div>

        <div id="s03-shake">
          <div id="s03-big">
            <div class="mask"><span class="display" id="s03-l1">Rotate it.</span></div>
            <div class="mask"><span class="display serif-i" id="s03-l2">Again.</span></div>
          </div>
          <div id="s03-count" class="eyebrow">Then update it everywhere it’s used</div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s03-reply", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 0);
          HF.typeOn(tl, document.getElementById("s03-type"), 0.05, 60);
          tl.fromTo("#s03-sub", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.9);
          tl.to("#s03-reply", { opacity: 0, scale: 0.96, filter: "blur(10px)", duration: 0.18, ease: "power2.in" }, 1.25);
          // smash cut
          tl.fromTo("#s03-l1", { yPercent: 105 }, { yPercent: 0, duration: 0.42, ease: "expo.out" }, 1.4);
          tl.fromTo("#s03-l2", { yPercent: 110 }, { yPercent: 0, duration: 0.42, ease: "expo.out" }, 2.1);
          tl.fromTo("#s03-shake", { x: 0, y: 0 }, { x: 10, y: -6, duration: 0.05, repeat: 3, yoyo: true, ease: "none" }, 2.1);
          tl.fromTo("#s03-big", { scale: 1 }, { scale: 1.06, duration: 2.0, ease: "none" }, 1.4);
          tl.fromTo("#s03-count", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 2.45);
          tl.to("#s03-shake", { opacity: 0, duration: 0.2 }, 3.2);
          window.__timelines["s03-rotate"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
