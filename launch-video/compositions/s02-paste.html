<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s02 {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s02 .cam {
          position: absolute;
          inset: 0;
        }
        #s02-term {
          left: 250px;
          top: 170px;
          width: 1420px;
          height: 660px;
        }
        #s02-userline {
          position: relative;
          display: inline-flex;
          gap: 16px;
          padding: 6px 14px;
          margin-left: -14px;
          border-radius: 10px;
        }
        #s02-key {
          color: var(--text);
        }
        #s02-box {
          position: absolute;
          left: -8px;
          top: -6px;
          right: -8px;
          bottom: -6px;
          border: 3px solid var(--danger);
          border-radius: 12px;
          background: rgba(255, 91, 79, 0.1);
          box-shadow: 0 0 40px rgba(255, 91, 79, 0.35);
        }
        #s02-leaks {
          position: absolute;
          left: 0;
          right: 0;
          top: 800px;
          display: flex;
          justify-content: center;
          gap: 28px;
        }
        #s02 .leak {
          position: relative;
          display: flex;
          align-items: center;
          gap: 16px;
          padding: 18px 26px;
          border-radius: 16px;
          background: rgba(24, 10, 10, 0.92);
          border: 1px solid rgba(255, 91, 79, 0.55);
          box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
          font-family: var(--sans);
          font-size: 34px;
          font-weight: 560;
          letter-spacing: -0.02em;
          color: var(--text);
          white-space: nowrap;
        }
        #s02 .leak i {
          font-style: normal;
          font-family: var(--mono);
          font-size: 22px;
          color: var(--danger-soft);
          letter-spacing: 0.08em;
        }
        #s02 .leak .dot {
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: var(--danger);
          box-shadow: 0 0 18px var(--danger);
        }
        #s02-flash {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse at 50% 55%, rgba(255, 91, 79, 0.28), transparent 65%);
          opacity: 0;
        }
      </style>

      <div id="s02" data-composition-id="s02-paste" data-width="1920" data-height="1080" data-duration="3.8">
        <div class="bg-fill" style="background: var(--ink-cold)"></div>
        <div class="bg-glow cold"></div>
        <div class="bg-grid"></div>
        <div id="s02-flash"></div>

        <div class="cam" id="s02-cam">
          <div class="term cold" id="s02-term">
            <div class="term-bar">
              <div class="term-dot"></div>
              <div class="term-dot"></div>
              <div class="term-dot"></div>
              <div class="term-title">claude — ~/shop-app</div>
            </div>
            <div class="term-body">
              <div class="t-prompt"><span class="t-caret">&gt;</span><span>add Stripe checkout to my app</span></div>
              <div class="t-line"><span class="t-bullet ok"></span><span>Created <span class="k-dim">app/api/checkout/route.ts</span></span></div>
              <div class="t-line"><span class="t-bullet ok"></span><span>Wired the checkout button in <span class="k-dim">components/Cart.tsx</span></span></div>
              <div class="t-line"><span class="t-bullet"></span><span>I need your <b style="font-weight: 600">Stripe secret key</b> to finish.</span></div>
              <div class="t-sub"><span class="t-elbow"></span><span>Paste it here and I'll add it to your .env.</span></div>
              <div class="t-prompt" id="s02-prompt" style="margin-top: 30px">
                <span class="t-caret">&gt;</span>
                <span id="s02-userline"
                  ><span id="s02-key">sk_live_<span></span>51NxT8qK2eZvKb3r9fQ7mA0pLwYh4cD8sJ6uVn2GtRb</span
                  ><span id="s02-box"></span
                ></span>
              </div>
            </div>
          </div>
        </div>

        <div id="s02-leaks">
          <div class="leak" id="s02-leak1"><span class="dot"></span>Sent to the model <i>CONTEXT</i></div>
          <div class="leak" id="s02-leak2"><span class="dot"></span>Saved in the transcript <i>HISTORY</i></div>
          <div class="leak" id="s02-leak3"><span class="dot"></span>Written to session logs <i>DISK</i></div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // Hold S1's closing camera, then the paste lands.
          tl.set("#s02-cam", { scale: 1.16, x: 150, y: -40 }, 0);
          tl.fromTo("#s02-userline", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.14, ease: "power2.out" }, 0.22);
          // Enter: key turns hot
          tl.to("#s02-key", { color: "#ff9b92", duration: 0.2 }, 0.62);
          tl.fromTo("#s02-box", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power2.inOut" }, 0.7);
          // punch in on the key
          tl.to("#s02-cam", { scale: 1.5, x: 290, y: -120, duration: 0.55, ease: "expo.out" }, 0.62);
          tl.fromTo("#s02-flash", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 0.62);
          tl.to("#s02-flash", { opacity: 0.35, duration: 0.8 }, 0.74);
          tl.to("#s02-term .term-body > :not(#s02-prompt), #s02-term .term-bar", { opacity: 0.22, duration: 0.5, ease: "power2.out" }, 0.9);
          // slow creep while the leaks pop
          tl.to("#s02-cam", { scale: 1.56, x: 300, y: -128, duration: 2.1, ease: "none" }, 1.17);
          ["#s02-leak1", "#s02-leak2", "#s02-leak3"].forEach((id, i) => {
            const t = 1.25 + i * 0.5;
            tl.fromTo(id, { opacity: 0, scale: 0.86, y: 18, filter: "blur(8px)" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "back.out(1.6)" }, t);
          });
          // glitch out
          const glitch = [
            [3.3, 18, "drop-shadow(8px 0 0 rgba(255,40,60,.8)) drop-shadow(-8px 0 0 rgba(0,190,255,.8))", 1],
            [3.36, -26, "none", 0.7],
            [3.42, 34, "drop-shadow(14px 0 0 rgba(255,40,60,.8)) drop-shadow(-14px 0 0 rgba(0,190,255,.8))", 1],
            [3.5, -12, "none", 0.4],
            [3.56, 40, "drop-shadow(20px 0 0 rgba(255,40,60,.8)) drop-shadow(-20px 0 0 rgba(0,190,255,.8))", 0.8],
            [3.64, 0, "none", 0],
          ];
          glitch.forEach(([t, dx, f, o]) => {
            tl.set("#s02-cam", { x: 300 + dx, filter: f, opacity: o }, t);
            tl.set(["#s02-leak1", "#s02-leak2", "#s02-leak3"], { x: -dx * 0.6, opacity: o }, t);
          });
          window.__timelines["s02-paste"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
