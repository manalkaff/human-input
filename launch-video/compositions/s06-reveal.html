<!doctype html>

  <body>
    <template>
      <style>
        #s06 {

          overflow: hidden;
        }
        #s06-flash {
          position: absolute;
          inset: 0;
          background: var(--accent);
        }
        #s06-ring {
          position: absolute;
          left: 660px;
          top: 240px;
          width: 600px;
          height: 600px;
          border-radius: 50%;
          border: 3px solid var(--accent);
          opacity: 0;
        }
        #s06-stage {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        #s06-lockup {
          display: flex;
          align-items: center;
          gap: 44px;
        }
        #s06-mark {
          width: 180px;
          height: 180px;
          flex: none;
                  }
        #s06-word {
          font-size: 184px;
          font-weight: 800;
          letter-spacing: -0.035em;
          overflow: hidden;
          padding: 0 0.04em 0.12em 0;
          line-height: 1;
          white-space: nowrap;
        }
        #s06-word .ch {
          display: inline-block;
        }
        #s06-eyebrow {
          margin-top: 36px;
          color: var(--muted);
        }
        #s06-tag {
          margin-top: 64px;
          display: flex;
          gap: 34px;
          font-family: var(--sans);
          font-size: 66px;
          font-weight: 700;
          font-stretch: 88%;
          letter-spacing: -0.02em;
          white-space: nowrap;
        }
        #s06-tag .serif-i {
          color: var(--accent-soft);
        }
      </style>

      <div id="s06" class="light" data-composition-id="s06-reveal" data-width="1920" data-height="1080" data-duration="4.53">
        <div class="bg-fill"></div>
        <div id="s06-flash"></div>
        <div id="s06-ring"></div>

        <div id="s06-stage">
          <div id="s06-lockup">
            <svg id="s06-mark" viewBox="0 0 160 160">
              <rect x="0" y="0" width="160" height="160" rx="28" fill="#2b44ff" />
              <path d="M52 48 q-12 0 -12 12 v10 q0 10 -9 10 q9 0 9 10 v10 q0 12 12 12" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M108 48 q12 0 12 12 v10 q0 10 9 10 q-9 0 -9 10 v10 q0 12 -12 12" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="80" cy="70" r="13" fill="#ffffff" />
              <path d="M73 76 L87 76 L91 106 L69 106 Z" fill="#ffffff" />
            </svg>
            <div class="display" id="s06-word">human-input</div>
          </div>
          <div class="eyebrow" id="s06-eyebrow">A plugin for Claude Code</div>
          <div id="s06-tag">
            <span id="s06-t1">Claude asks.</span>
            <span id="s06-t2">You type.</span>
            <span id="s06-t3">Claude <span class="serif-i">never</span> sees it.</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const chars = HF.splitChars(document.getElementById("s06-word"));
          // impact
          tl.fromTo("#s06-flash", { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 100% 0%)", duration: 0.55, ease: "expo.inOut" }, 0.04);
          tl.fromTo("#s06-ring", { opacity: 1, scale: 0.05 }, { opacity: 0, scale: 2.6, duration: 0.9, ease: "expo.out" }, 0);
                // mark lands centered, then the lockup opens
          const lockupShift = 545;
          tl.fromTo("#s06-mark", { scale: 0, rotation: -25, x: lockupShift }, { scale: 1, rotation: 0, x: lockupShift, duration: 0.55, ease: "back.out(1.8)" }, 0.02);
          tl.to("#s06-mark", { x: 0, duration: 0.6, ease: "expo.inOut" }, 0.58);
          tl.fromTo(chars, { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "expo.out", stagger: 0.028 }, 0.78);
          tl.fromTo("#s06-eyebrow", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.4);
          // tagline on the beat
          [["#s06-t1", 2.265], ["#s06-t2", 2.64], ["#s06-t3", 3.02]].forEach(([id, t]) => {
            tl.fromTo(id, { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, t);
          });
          tl.fromTo("#s06-stage", { scale: 1 }, { scale: 1.035, duration: 4.0, ease: "none" }, 0);
          // exit: push through
          tl.to("#s06-stage", { scale: 1.6, opacity: 0, filter: "blur(18px)", duration: 0.4, ease: "power3.in" }, 4.13);
          window.__timelines["s06-reveal"] = tl;
        })();
      </script>
    </template>
  </body>
